[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dirsociety"
version = "0.1.0"
description = "Fast, stealthy web content-discovery scanner with 403 bypass and AI triage"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "umaruddin.s" }]
keywords = ["security", "pentest", "dirsearch", "content-discovery", "fuzzing", "403-bypass"]
dependencies = []  # pure standard library

[project.scripts]
dirsociety = "dirsociety.cli:main"

[tool.setuptools]
packages = ["dirsociety"]

[tool.setuptools.package-data]
dirsociety = ["wordlists/*.txt"]
