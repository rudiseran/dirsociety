name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (no runtime deps — pure stdlib)
        run: pip install .
      - name: Run tests
        run: python tests/test_dirsociety.py
      - name: Smoke test (offline — no scanning)
        run: |
          dirsociety --version
          dirsociety --help > /dev/null
